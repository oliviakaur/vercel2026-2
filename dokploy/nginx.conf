server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data: https:; frame-src 'self' https:; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        try_files /index.html =404;
        expires -1;
    }

    location = /config.js {
        try_files /config.js =404;
        expires -1;
    }

    location = /frontend-new.js {
        try_files /frontend-new.js =404;
        expires 5m;
    }

    location = /newsgo-inject.js {
        try_files /newsgo-inject.js =404;
        expires 5m;
    }

    location = /newsgo-inject.css {
        try_files /newsgo-inject.css =404;
        expires 5m;
    }

    location = /styles.css {
        try_files /styles.css =404;
        expires 5m;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        expires 1d;
    }

    # The public API is proxied same-origin so a new frontend domain does not
    # need to be added to the backend CORS allowlist before it can render.
    location ^~ /v1/ {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name powerhouse.my.id;
        proxy_set_header Host powerhouse.my.id;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_hide_header Set-Cookie;
        proxy_pass https://powerhouse.my.id;
    }

    location = /health {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_ssl_name powerhouse.my.id;
        proxy_set_header Host powerhouse.my.id;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header Set-Cookie;
        proxy_pass https://powerhouse.my.id;
    }

    location = /ready {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_ssl_name powerhouse.my.id;
        proxy_set_header Host powerhouse.my.id;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header Set-Cookie;
        proxy_pass https://powerhouse.my.id;
    }

    # Crawler endpoints and legacy redirects stay on the SEO Worker. A Worker
    # error is returned as-is so sitemap/robots failures never become soft 200s.
    location = /robots.txt { include /etc/nginx/newsgo-edge-proxy.conf; }
    location = /sitemap.xml { include /etc/nginx/newsgo-edge-proxy.conf; }
    location ^~ /sitemaps/ { include /etc/nginx/newsgo-edge-proxy.conf; }
    location = /rss.xml { include /etc/nginx/newsgo-edge-proxy.conf; }
    location ~ ^/[A-Za-z0-9-]{8,128}\.txt$ { include /etc/nginx/newsgo-edge-proxy.conf; }
    location ~ ^/article/[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?/[1-9][0-9]{0,15}$ {
        include /etc/nginx/newsgo-edge-proxy.conf;
    }

    # Prefer server-rendered article HTML from the Worker. While that service
    # is temporarily unavailable, keep the browser frontend usable via CSR.
    location ~ ^/[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?/[a-z0-9]+(?:-[a-z0-9]+)*$ {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name newsgo-edge.newsgov2.workers.dev;
        proxy_set_header Host newsgo-edge.newsgov2.workers.dev;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors on;
        error_page 502 503 504 = @article_spa;
        proxy_pass https://newsgo-edge.newsgov2.workers.dev;
    }

    location @article_spa {
        try_files /index.html =404;
        expires -1;
    }

    location / {
        return 404;
    }
}
